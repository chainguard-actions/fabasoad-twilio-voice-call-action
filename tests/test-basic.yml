name: Test basic usage with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          twilio-auth-token: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          text: "Hello from GitHub Actions test"
          from: "+15005550006"
          to: "+15005550001"
          voice: alice
          twilio-log-level: debug
      - name: Assert action ran (expected to fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid,
          # but it must have run (outcome is 'failure', not 'skipped' or empty)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run and fail"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly (maybe test credentials work?)"
          fi
          echo "PASS: action ran with outcome=$OUTCOME (failure expected with dummy credentials)"
