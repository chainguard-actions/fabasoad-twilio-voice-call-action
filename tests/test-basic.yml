name: Test basic usage - invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with fake credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          twilio-auth-token: fake_auth_token_for_testing_only
          text: "Hello from GitHub Actions test"
          from: "+15005550006"
          to: "+15005550001"
          voice: alice
          twilio-log-level: debug
      - name: Assert action failed due to auth error (not missing inputs)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "WARN: action unexpectedly succeeded (real Twilio call made?)"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
