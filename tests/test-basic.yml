name: Test basic usage with dummy credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          twilio-auth-token: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          text: "Hello from GitHub Actions test"
          from: "+15005550006"
          to: "+15005550006"
          voice: alice
          twilio-log-level: debug
      - name: Assert action ran (expected to fail with API error, not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because credentials are invalid (Twilio API error),
          # not because of a missing dist/index.js or configuration issue.
          # We accept either 'failure' (API rejected) or 'success' (unlikely with dummy creds).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
