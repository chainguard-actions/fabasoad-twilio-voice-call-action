---
name: Test invalid voice input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unsupported voice
        id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken0000000000000000000"
          text: "Hello from test"
          from: "+15005550006"
          to: "+15005550001"
          voice: "robot"
          twilio-log-level: "debug"

      - name: Assert action failed due to unsupported voice
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported voice, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with unsupported voice"
