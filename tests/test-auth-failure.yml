---
name: Test authentication failure with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken000000000000000000000"
          text: "Hello from GitHub Actions test"
          from: "+15550000001"
          to: "+15550000002"
          voice: "alice"
          twilio-log-level: "debug"
      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid Twilio credentials"
