name: Test default voice parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          twilio-auth-token: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          text: "Test message with default voice"
          from: "+15005550006"
          to: "+15005550001"
          # voice defaults to alice, twilio-log-level defaults to debug
      - name: Assert action ran with default voice
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid,
          # but it must have run (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME using default voice parameter"
