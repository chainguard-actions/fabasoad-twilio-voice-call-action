name: Test default voice parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without specifying voice (should use default 'alice')
        id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          twilio-auth-token: fake_auth_token_for_testing_only
          text: "Testing default voice parameter"
          from: "+15005550006"
          to: "+15005550001"
      - name: Assert action ran (failed due to auth, not missing voice input)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed at API level (not at input validation), default voice was accepted"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
