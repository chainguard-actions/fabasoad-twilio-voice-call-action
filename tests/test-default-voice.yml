---
name: Test default voice parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without specifying voice (uses default alice)
        id: action
        uses: .
        with:
          twilio-account-sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          twilio-auth-token: "fake-auth-token-for-testing"
          text: "Testing default voice parameter"
          from: "+15550000001"
          to: "+15550000002"
          # voice not specified — should default to alice
          twilio-log-level: debug
        continue-on-error: true
      - name: Assert action failed at API level (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action reached API call stage (default voice was accepted)"
