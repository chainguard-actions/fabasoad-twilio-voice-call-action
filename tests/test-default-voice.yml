---
name: Test default voice value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without specifying voice (should use default alice)
        id: action_no_voice
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken0000000000000000000"
          text: "Hello from test using default voice"
          from: "+15005550006"
          to: "+15005550001"
          twilio-log-level: "debug"

      - name: Assert action failed at API call (not at voice validation)
        env:
          OUTCOME: ${{ steps.action_no_voice.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid credentials (API error),
          # NOT because of an unsupported voice. This confirms the default voice
          # 'alice' passes validation and the action proceeds to the API call.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to invalid credentials), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed at API call stage (default voice 'alice' passed validation)"

      - name: Run action with explicit valid voice man
        id: action_man_voice
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken0000000000000000000"
          text: "Hello from test using man voice"
          from: "+15005550006"
          to: "+15005550001"
          voice: "man"
          twilio-log-level: "debug"

      - name: Assert man voice also passes validation
        env:
          OUTCOME: ${{ steps.action_man_voice.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to invalid credentials), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with 'man' voice failed at API call stage (voice validation passed)"

      - name: Run action with explicit valid voice woman
        id: action_woman_voice
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken0000000000000000000"
          text: "Hello from test using woman voice"
          from: "+15005550006"
          to: "+15005550001"
          voice: "woman"
          twilio-log-level: "debug"

      - name: Assert woman voice also passes validation
        env:
          OUTCOME: ${{ steps.action_woman_voice.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (due to invalid credentials), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with 'woman' voice failed at API call stage (voice validation passed)"
