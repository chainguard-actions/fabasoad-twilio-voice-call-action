---
name: Test default voice input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-no-voice
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken000000000000000000000"
          text: "Hello from test"
          from: "+15005550006"
          to: "+15005550001"
          # voice not specified — should default to "alice" (a supported voice)
          # action will fail at Twilio API call (bad credentials), not at voice validation
      - name: Assert action failed at API level not voice validation
        env:
          OUTCOME: ${{ steps.action-no-voice.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (bad credentials), but NOT because of an unsupported voice.
          # If voice defaulted to something unsupported, the error message would differ.
          # Either way, the step must have run (not skipped) and failed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and failed at API level (default voice 'alice' was accepted)"
      - id: action-man-voice
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken000000000000000000000"
          text: "Hello from test"
          from: "+15005550006"
          to: "+15005550001"
          voice: "man"
      - name: Assert man voice is accepted
        env:
          OUTCOME: ${{ steps.action-man-voice.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: 'man' voice was accepted (action failed at API level, not voice validation)"
      - id: action-woman-voice
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACfakeaccountsid00000000000000000"
          twilio-auth-token: "fakeauthtoken000000000000000000000"
          text: "Hello from test"
          from: "+15005550006"
          to: "+15005550001"
          voice: "woman"
      - name: Assert woman voice is accepted
        env:
          OUTCOME: ${{ steps.action-woman-voice.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: 'woman' voice was accepted (action failed at API level, not voice validation)"
