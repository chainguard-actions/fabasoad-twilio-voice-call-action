---
name: Test default voice parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without specifying voice (should use default 'alice')
        id: action
        uses: .
        with:
          twilio-account-sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          twilio-auth-token: fake-auth-token-for-testing
          text: "Testing default voice parameter"
          from: "+15005550006"
          to: "+15005550006"
        continue-on-error: true
      - name: Assert action attempted to run (failed due to invalid credentials, not missing input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran with default voice parameter and failed as expected due to invalid credentials"
