---
name: Test default optional parameter values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          twilio-auth-token: "fake-auth-token-for-testing"
          text: "Testing default voice and log level"
          from: "+15005550006"
          to: "+15005550006"
          # voice defaults to "alice"
          # twilio-log-level defaults to "debug"
      - name: Assert action failed with invalid credentials (defaults accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with default optional params correctly failed with invalid credentials"
