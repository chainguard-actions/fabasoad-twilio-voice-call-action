---
name: Test voice parameter with woman option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with voice set to woman
        id: action
        uses: .
        with:
          twilio-account-sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          twilio-auth-token: "fake-auth-token-for-testing"
          text: "Testing woman voice parameter"
          from: "+15550000001"
          to: "+15550000002"
          voice: woman
          twilio-log-level: debug
        continue-on-error: true
      - name: Assert action failed at API level (voice input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted 'woman' voice parameter and reached API call stage"
