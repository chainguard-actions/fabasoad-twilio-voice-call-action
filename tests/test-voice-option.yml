---
name: Test voice option parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test with voice=man
        id: action-man
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          twilio-auth-token: "fake-auth-token-for-testing"
          text: "Testing man voice"
          from: "+15005550006"
          to: "+15005550006"
          voice: "man"
          twilio-log-level: "debug"
      - name: Assert man voice action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action-man.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with voice=man correctly failed with invalid credentials"
      - name: Test with voice=woman
        id: action-woman
        uses: .
        continue-on-error: true
        with:
          twilio-account-sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          twilio-auth-token: "fake-auth-token-for-testing"
          text: "Testing woman voice"
          from: "+15005550006"
          to: "+15005550006"
          voice: "woman"
          twilio-log-level: "debug"
      - name: Assert woman voice action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action-woman.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with voice=woman correctly failed with invalid credentials"
